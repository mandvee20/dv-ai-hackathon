<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pre-Check-in</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-container">

    <div class="form-card">

        <div class="form-header">
            <h1>Pre-Check-in</h1>
            <p>Complete your details before arriving at the hotel.</p>
        </div>

        <form id="preCheckinForm">

            <!-- Reservation Details -->
            <section>
                <h2>Reservation Details</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="reservationNumber">
                            Reservation Number
                        </label>

                        <input
                                type="text"
                                id="reservationNumber"
                                name="reservationNumber"
                                placeholder="Enter reservation number"
                                required>
                    </div>

                    <div class="form-group">
                        <label for="roomNumber">
                            Room Number
                        </label>

                        <input
                                type="text"
                                id="roomNumber"
                                name="roomNumber"
                                placeholder="Enter room number"
                                required>
                    </div>

                </div>
            </section>


            <!-- Guest Details -->
            <section>
                <h2>Guest Details</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="First name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Last name"
                            required>
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobileNumber"
                            name="mobileNumber"
                            placeholder="+1 234 567 890"
                            required>
                    </div>

                </div>


                <div class="form-group">
                    <label for="nationality">
                        Nationality
                    </label>

                    <input
                        type="text"
                        id="nationality"
                        name="nationality"
                        placeholder="Nationality">
                </div>

            </section>


            <!-- Stay Details -->
            <section>

                <h2>Stay Details</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="arrivalDate">
                            Arrival Date
                        </label>

                        <input
                            type="date"
                            id="arrivalDate"
                            name="arrivalDate"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="departureDate">
                            Departure Date
                        </label>

                        <input
                            type="date"
                            id="departureDate"
                            name="departureDate"
                            required>
                    </div>

                </div>


                <div class="form-group">

                    <label for="estimatedArrivalTime">
                        Estimated Arrival Time
                    </label>

                    <input
                        type="time"
                        id="estimatedArrivalTime"
                        name="estimatedArrivalTime">

                </div>

            </section>


            <!-- Identity Details -->
            <section>

                <h2>Identity Details</h2>

                <div class="form-row">

                    <div class="form-group">

                        <label for="idType">
                            ID Type
                        </label>

                        <select
                            id="idType"
                            name="idType"
                            required>

                            <option value="">
                                Select ID type
                            </option>

                            <option value="PASSPORT">
                                Passport
                            </option>

                            <option value="DRIVING_LICENSE">
                                Driving License
                            </option>

                            <option value="NATIONAL_ID">
                                National ID
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="idNumber">
                            ID Number
                        </label>

                        <input
                            type="text"
                            id="idNumber"
                            name="idNumber"
                            placeholder="Enter ID number"
                            required>

                    </div>

                </div>

            </section>


            <!-- Consent -->
            <section>

                <div class="consent">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    <label for="terms">
                        I confirm that the information provided is correct
                        and I agree to the hotel's terms and conditions.
                    </label>

                </div>

            </section>


            <!-- Status -->
            <div id="formMessage" class="form-message"></div>


            <!-- Submit -->
            <button
                type="submit"
                id="submitButton">

                Complete Pre-Check-in

            </button>

        </form>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
