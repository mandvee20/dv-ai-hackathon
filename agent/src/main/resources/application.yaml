spring:
  application:
    name: agent

  datasource:
    url: jdbc:mariadb://localhost:3306/log_analysis
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9079

logging:
  file:
    name: logs/agent.log

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

  level:
    root: INFO
