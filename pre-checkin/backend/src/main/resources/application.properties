# ============================================================
# Application
# ============================================================

spring.application.name=pre-checkin-service

server.port=8080


# ============================================================
# Database
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/pre_checkin_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# Logging
# ============================================================

logging.level.com.example.precheckin=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# ============================================================
# API Configuration
# ============================================================

# This will be used later when we integrate
# the second Java service.

checkin.service.url=http://localhost:8081

